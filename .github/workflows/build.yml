name: Build RPM Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: podman build --output type=local,dest=./output .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: output
          if-no-files-found: error
